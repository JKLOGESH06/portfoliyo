<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J. K. Logesh — ATS-Friendly Professional Resume</title>
  <meta name="description" content="ATS-Friendly Professional Resume of J. K. Logesh, Electrical & Electronics Engineering student at Nandha Engineering College, Erode.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #F0EDE6;
      min-height: 100vh;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== PAGE WRAPPER ===== */
    .resume-page {
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* ===== BACK LINK ===== */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #5a5a5a;
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: 28px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #C8752F; }
    .back-link svg { width: 16px; height: 16px; }

    /* ===== PAGE HEADER ===== */
    .page-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .official-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0E3B2E;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .official-badge::before {
      content: '✦';
      font-size: 8px;
      opacity: 0.7;
    }

    .page-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #0E3B2E;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    @media (max-width: 600px) {
      .page-title { font-size: 22px; }
    }

    .page-subtitle {
      font-size: 13.5px;
      color: #6b7280;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* ===== ACTION BUTTONS ROW ===== */
    .action-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      white-space: nowrap;
    }

    .action-btn:active { transform: scale(0.97); }

    .btn-print {
      background: #C8752F;
      color: #fff;
      border-color: #C8752F;
      box-shadow: 0 3px 12px rgba(200,117,47,0.28);
    }
    .btn-print:hover {
      background: #a85f22;
      border-color: #a85f22;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(200,117,47,0.35);
    }

    .btn-copy {
      background: #fff;
      color: #0E3B2E;
      border-color: #c8d5cf;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .btn-copy:hover {
      border-color: #0E3B2E;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(14,59,46,0.12);
    }

    .btn-edit {
      background: #fff;
      color: #7A4415;
      border-color: #d6b896;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .btn-edit:hover {
      border-color: #C8752F;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(200,117,47,0.15);
    }

    /* ===== RESUME CARD ===== */
    .resume-card {
      background: #FFFFFF;
      border-radius: 10px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10), 0 1px 6px rgba(0,0,0,0.06);
      padding: 32pt 36pt;
      position: relative;
    }

    @media (max-width: 600px) {
      .resume-card { padding: 20pt 16pt; }
    }

    /* ===== ATS RESUME STYLES ===== */
    .ats-resume {
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      font-size: 9pt;
      line-height: 1.32;
      color: #111111;
    }

    /* Header */
    .r-header {
      text-align: center;
      border-bottom: 1.5pt solid #111111;
      padding-bottom: 7pt;
      margin-bottom: 9pt;
    }

    .r-name {
      font-size: 18pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2pt;
      color: #111111;
      margin-bottom: 5pt;
    }

    .r-contacts {
      font-size: 8.5pt;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 5pt;
      line-height: 1.4;
    }
    .r-contacts a { color: #333; text-decoration: none; }
    .r-contacts a:hover { text-decoration: underline; }
    .r-contacts .sep { color: #999; }

    /* Section */
    .r-section {
      margin-bottom: 7pt;
    }

    .r-section-title {
      font-size: 9pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6pt;
      color: #111111;
      border-bottom: 1pt solid #111111;
      padding-bottom: 1.5pt;
      margin-bottom: 5pt;
    }

    .r-text {
      font-size: 8.5pt;
      color: #222;
      line-height: 1.35;
      text-align: justify;
      max-width: none;
      margin: 0;
    }

    /* Entry rows */
    .r-entry { margin-bottom: 4pt; }

    .r-entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8pt;
    }

    .r-entry-left {
      font-size: 9pt;
      font-weight: 700;
      color: #111;
    }

    .r-entry-right {
      font-size: 8.5pt;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .r-entry-sub {
      font-size: 8.5pt;
      font-weight: 700;
      color: #222;
      margin-top: 1pt;
    }

    .r-subtext {
      font-size: 8pt;
      color: #444;
      margin-top: 1pt;
    }

    /* Bullet list */
    .r-list {
      margin: 2pt 0 0 14pt;
      padding: 0;
      list-style-type: disc;
    }
    .r-list li {
      font-size: 8.5pt;
      color: #222;
      line-height: 1.32;
      margin-bottom: 2.5pt;
    }
    .r-list li strong {
      color: #111;
      font-weight: 700;
    }

    /* ===== TOAST NOTIFICATION ===== */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0E3B2E;
      color: #fff;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 6px 24px rgba(0,0,0,0.2);
      transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ===== PRINT STYLES ===== */
    @media print {
      @page { size: A4 portrait; margin: 6mm 8mm; }
      body { background: #fff !important; }
      .back-link, .page-header, .action-bar { display: none !important; }
      .resume-page { padding: 0; max-width: 100%; }
      .resume-card {
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
      }
      .toast { display: none !important; }
    }
  </style>
</head>

<body>
  <div class="resume-page">

    <!-- Back Link -->
    <a href="index.html" class="back-link" id="backLink">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
      </svg>
      Back to Portfolio
    </a>

    <!-- Page Header -->
    <div class="page-header">
      <div class="official-badge">Official Document</div>
      <h1 class="page-title">ATS-Friendly Professional Resume</h1>
      <p class="page-subtitle">Formatted specifically for ATS (Applicant Tracking Systems), recruiters, and college placement drives.</p>
    </div>

    <!-- Action Buttons -->
    <div class="action-bar">
      <button class="action-btn btn-print" onclick="window.print()" id="btnPrint">
        🖨️ Print / Save as ATS PDF
      </button>
      <button class="action-btn btn-copy" onclick="copyPlainText()" id="btnCopy">
        📋 Copy Raw Text for Applications
      </button>
      <button class="action-btn btn-edit" onclick="scrollToEdit()" id="btnEdit">
        ✏️ Edit Contact &amp; Info
      </button>
    </div>

    <!-- Resume Card -->
    <div class="resume-card" id="resumeCard">
      <div class="ats-resume" id="resumeContent">
        <!-- Rendered by JS -->
      </div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast">✓ Copied to clipboard!</div>

  <!-- Config Data -->
  <script src="js/config.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const d = window.PORTFOLIO_DATA;
      const p = d.personal;
      const edu = d.education[0];
      const fp = d.featuredProject;
      const exp = d.experience ? d.experience[0] : null;

      // Update page title
      document.title = `${p.fullName} — ATS-Friendly Professional Resume`;

      const container = document.getElementById('resumeContent');
      container.innerHTML = buildResume(d, p, edu, fp, exp);
    });

    function buildResume(d, p, edu, fp, exp) {
      return `
        <!-- HEADER -->
        <div class="r-header">
          <div class="r-name">${p.fullName.toUpperCase()}</div>
          <div class="r-contacts">
            <span>📞 +91 ${p.phone}</span>
            <span class="sep">|</span>
            <span>✉️ ${p.email}</span>
            <span class="sep">|</span>
            <span>🔗 <a href="${p.linkedin}" target="_blank" rel="noopener">linkedin.com/in/logesh-j-k</a></span>
            <span class="sep">|</span>
            <span>💻 <a href="${p.github}" target="_blank" rel="noopener">github.com/JKLOGESH06</a></span>
          </div>
        </div>

        <!-- PROFESSIONAL SUMMARY -->
        <div class="r-section">
          <div class="r-section-title">Professional Summary</div>
          <p class="r-text">Motivated Electrical and Electronics Engineering student with a strong passion for electronics, embedded systems, and emerging technologies. Equipped with foundational skills in circuit principles and microcontroller applications, seeking entry-level engineering roles and internship opportunities to deliver practical, innovative technological solutions.</p>
        </div>

        <!-- EDUCATION -->
        <div class="r-section">
          <div class="r-section-title">Education</div>
          <div class="r-entry">
            <div class="r-entry-header">
              <span class="r-entry-left">Electrical and Electronics Engineering</span>
              <span class="r-entry-right">Year of Study: 3rd Year | Expected: 2026</span>
            </div>
            <div class="r-entry-sub">${edu.institution}</div>
            <div class="r-subtext">Academic Standing: ${edu.cgpa}</div>
          </div>
        </div>

        <!-- TECHNICAL SKILLS -->
        <div class="r-section">
          <div class="r-section-title">Technical Skills</div>
          <ul class="r-list">
            ${d.technicalSkills.map(g => `<li><strong>${g.category}:</strong> ${g.skills.join(', ')}</li>`).join('')}
            <li><strong>Soft Skills:</strong> ${d.softSkills.map(s => s.name).join(', ')}</li>
          </ul>
        </div>

        <!-- PROJECTS -->
        <div class="r-section">
          <div class="r-section-title">Projects</div>
          <div class="r-entry">
            <div class="r-entry-header">
              <span class="r-entry-left">${fp.title}</span>
              <span class="r-entry-right" style="font-style:italic;font-weight:normal;">${fp.category}</span>
            </div>
            <ul class="r-list">
              <li><strong>Problem &amp; SDG Mapping:</strong> Developed an automated hybrid renewable energy control system to eliminate rural power outages, aligning with SDG 7 (Affordable &amp; Clean Energy) and SDG 13 (Climate Action).</li>
              <li><strong>5-Tier Priority Switching Algorithm:</strong> Engineered zero-overlap priority logic: Solar (Day/Primary) → Battery Inverter (Night, &gt;20% SOC) → AC Grid (Night, &lt;20% SOC) → Generator Backup → Auto-Solar Restore.</li>
              <li><strong>Technical Implementation:</strong> Integrated Embedded C microcontroller control, charge controllers, relay switching networks, and real-time battery/grid telemetry for safe, automated power source selection.</li>
            </ul>
          </div>

          ${(d.otherProjects || []).map(p => `
            <div class="r-entry" style="margin-top: 5pt;">
              <div class="r-entry-header">
                <span class="r-entry-left">${p.title}</span>
                <span class="r-entry-right" style="font-style:italic;font-weight:normal;">${p.category}</span>
              </div>
              <ul class="r-list">
                <li>${p.problem} <strong>Technologies:</strong> ${p.technologies.join(', ')}.</li>
              </ul>
            </div>
          `).join('')}
        </div>

        <!-- INDUSTRIAL VISIT / FIELD VISIT -->
        <div class="r-section">
          <div class="r-section-title">INDUSTRIAL VISIT / FIELD VISIT</div>
          <div class="r-entry">
            <div class="r-entry-header">
              <span class="r-entry-left">Coral Coil India Private Limited, Erode</span>
              <span class="r-entry-right" style="font-style:italic;font-weight:normal;">Field Visit</span>
            </div>
            <ul class="r-list">
              <li>Observed the manufacturing process of wind-turbine generators, including stator and rotor assembly.</li>
              <li>Gained practical exposure to industrial operations, quality testing and real-time production systems.</li>
            </ul>
          </div>
        </div>

        <!-- CERTIFICATIONS -->
        <div class="r-section">
          <div class="r-section-title">Certifications</div>
          <ul class="r-list">
            ${d.certifications.map(c => `<li><strong>${c.title}</strong> &mdash; ${c.organization}</li>`).join('')}
          </ul>
        </div>

        <!-- ACHIEVEMENTS -->
        <div class="r-section">
          <div class="r-section-title">Achievements</div>
          <ul class="r-list">
            ${d.achievements.map(a => `<li><strong>${a.title.includes('1st') ? '1st Prize Winner' : '3rd Prize Winner'}:</strong> ${a.description}</li>`).join('')}
          </ul>
        </div>

        <!-- ADDITIONAL INFORMATION -->
        <div class="r-section">
          <div class="r-section-title">Additional Information</div>
          <ul class="r-list">
            <li><strong>Workshops &amp; Technical Training:</strong> ${d.additionalInformation.workshops}</li>
            <li><strong>Languages Known:</strong> ${d.additionalInformation.languages.join(', ')}</li>
          </ul>
        </div>
      `;
    }

    // Copy plain-text version to clipboard
    function copyPlainText() {
      const d = window.PORTFOLIO_DATA;
      const p = d.personal;
      const edu = d.education[0];
      const fp = d.featuredProject;
      const exp = d.experience ? d.experience[0] : null;

      const text = [
        p.fullName.toUpperCase(),
        `+91 ${p.phone} | ${p.email} | linkedin.com/in/logesh-j-k | github.com/JKLOGESH06`,
        '',
        'PROFESSIONAL SUMMARY',
        'Motivated Electrical and Electronics Engineering student with a strong passion for electronics, embedded systems, and emerging technologies. Equipped with foundational skills in circuit principles and microcontroller applications, seeking entry-level engineering roles and internship opportunities to deliver practical, innovative technological solutions.',
        '',
        'EDUCATION',
        `Electrical and Electronics Engineering | Year of Study: 3rd Year | Expected: 2026`,
        `${edu.institution}`,
        `Academic Standing: ${edu.cgpa}`,
        '',
        'TECHNICAL SKILLS',
        ...d.technicalSkills.map(g => `• ${g.category}: ${g.skills.join(', ')}`),
        `• Soft Skills: ${d.softSkills.map(s => s.name).join(', ')}`,
        '',
        'PROJECTS',
        `${fp.title} | ${fp.category}`,
        '• Problem & SDG Mapping: Developed an automated hybrid renewable energy control system to eliminate rural power outages, aligning with SDG 7 (Affordable & Clean Energy) and SDG 13 (Climate Action).',
        '• 5-Tier Priority Switching Algorithm: Engineered zero-overlap priority logic: Solar (Day/Primary) → Battery Inverter (Night, >20% SOC) → AC Grid (Night, <20% SOC) → Generator Backup → Auto-Solar Restore.',
        '• Technical Implementation: Integrated Embedded C microcontroller control, charge controllers, relay switching networks, and real-time battery/grid telemetry for safe, automated power source selection.',
        '• Technology Readiness Level (TRL): Formulated and validated TRL 2-3 proof-of-concept model for low-cost, scalable rural hybrid energy deployment.',
        '',
        'INDUSTRIAL VISIT / FIELD VISIT',
        'Coral Coil India Private Limited, Erode | Field Visit',
        '• Observed the manufacturing process of wind-turbine generators, including stator and rotor assembly.',
        '• Gained practical exposure to industrial operations, quality testing and real-time production systems.',
        '',
        'CERTIFICATIONS',
        ...d.certifications.map(c => `• ${c.title} — ${c.organization}`),
        '',
        'ACHIEVEMENTS',
        ...d.achievements.map(a => `• ${a.description}`),
        '',
        'ADDITIONAL INFORMATION',
        `• Workshops & Technical Training: ${d.additionalInformation.workshops}`,
        `• Languages Known: ${d.additionalInformation.languages.join(', ')}`
      ].join('\n');

      navigator.clipboard.writeText(text).then(() => showToast('✓ Plain text copied!')).catch(() => {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✓ Plain text copied!');
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function scrollToEdit() {
      showToast('ℹ️ Edit data in js/config.js to update resume');
    }
  </script>
</body>

</html>
